<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 32 32">
  <!-- Bloomy favicon: a small green flower, matching the brand greens
       (primary forest #41702f petals, accent sage #7ea467 centre + leaf) and
       the potted-plant domain. Hand-authored, monochrome-green so it reads at
       16px and on both light and dark browser-tab backgrounds. -->
  <!-- Stem -->
  <path stroke="#41702f" stroke-width="2.4" stroke-linecap="round" d="M16 16v11" />
  <!-- Leaf on the stem -->
  <path fill="#7ea467" d="M16 24c-3.4-.2-5.8-2.6-6-6 3.4.2 5.8 2.6 6 6Z" />
  <!-- Six petals around the flower centre (each rotated about the centre 16,14) -->
  <g fill="#41702f">
    <ellipse cx="16" cy="7" rx="3.3" ry="6.6" />
    <ellipse cx="16" cy="7" rx="3.3" ry="6.6" transform="rotate(60 16 14)" />
    <ellipse cx="16" cy="7" rx="3.3" ry="6.6" transform="rotate(120 16 14)" />
    <ellipse cx="16" cy="7" rx="3.3" ry="6.6" transform="rotate(180 16 14)" />
    <ellipse cx="16" cy="7" rx="3.3" ry="6.6" transform="rotate(240 16 14)" />
    <ellipse cx="16" cy="7" rx="3.3" ry="6.6" transform="rotate(300 16 14)" />
  </g>
  <!-- Flower centre -->
  <circle cx="16" cy="14" r="3.8" fill="#7ea467" />
</svg>
