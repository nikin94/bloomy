# Deploy to the live Firebase Hosting channel on every push to main.
# The build bakes the public Firebase web config (VITE_FIREBASE_*) into the
# bundle, so those values are provided as repository secrets at build time.
# Deploy auth uses a Firebase service account stored in repository secrets.
name: Deploy to Firebase Hosting (live)

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # Make least-privilege explicit so the deploy doesn't depend on the repo's
    # default workflow-token permissions. No pull-requests: write — this
    # workflow posts no PR comment.
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # setup-node@v5 enables package-manager caching by default, which probes
          # `yarn cache dir` before the Corepack step below runs — at that point the
          # runner's global yarn is still 1.x and errors on the packageManager field.
          # Disable it; the immutable install is fast enough without the cache.
          package-manager-cache: false

      # Repo uses Yarn 4 (Berry) — Corepack activates the version pinned in
      # package.json's "packageManager" field.
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Sentry error monitoring. Without this the CI-built bundle has no DSN,
          # so Sentry.init() no-ops and no events are ever sent (the local .env
          # DSN only applies to a `yarn deploy` from a dev machine, which the
          # auto-deploy here overwrites). Public/embeddable value — a secret keeps
          # it configurable and consistent with the Firebase config above.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BLOOMY_B69DF }}
          channelId: live
          projectId: bloomy-b69df
