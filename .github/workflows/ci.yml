# Pull-request checks: type-check, lint, and run the test suite on every PR.
# Runs no build and needs no secrets (so it works for fork PRs too); the
# production build is exercised separately by the deploy workflow on push to main.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # setup-node@v5 enables package-manager caching by default, which probes
          # `yarn cache dir` before the Corepack step below runs — at that point the
          # runner's global yarn is still 1.x and errors on the packageManager field.
          # Disable it; the immutable install is fast enough without the cache.
          package-manager-cache: false

      # Repo uses Yarn 4 (Berry) — Corepack activates the version pinned in
      # package.json's "packageManager" field.
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type-check
        run: yarn tsc -b

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test
        # Dummy, well-formed Firebase config so the SDK initializes during tests
        # (firebase/client.ts calls getAuth at import; an empty api key throws
        # auth/invalid-api-key). These are FAKE placeholders, not secrets — the
        # tests never hit the network — so fork PRs still run. Locally the same
        # values come from .env; this provides them where there is no .env.
        env:
          VITE_FIREBASE_API_KEY: test-api-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-bloomy.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-bloomy
          VITE_FIREBASE_STORAGE_BUCKET: demo-bloomy.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:test'
